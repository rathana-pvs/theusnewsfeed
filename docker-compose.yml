services:
  db:
    image: postgres:15-alpine
    container_name: theusnewsfeed-db
    restart: always
    environment:
      POSTGRES_USER: theusnewsfeed
      POSTGRES_PASSWORD: theusnewsfeed_pass_123
      POSTGRES_DB: theusnewsfeed
    ports:
      - '127.0.0.1:5441:5432'
    volumes:
      - theusnewsfeed_db_data:/var/lib/postgresql/data

volumes:
  theusnewsfeed_db_data:
